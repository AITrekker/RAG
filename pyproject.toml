[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.12"
# Dependencies get added as each step needs them.
dependencies = [
  "pyyaml",
  "rank-bm25>=0.2.2",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
