[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Dependencies get added as each step needs them.
dependencies = [
  "numpy>=2.5.5",
  "pyyaml",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=6.3.0",
  "snowballstemmer>=3.1.1",
  "torch>=2.11.0",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
