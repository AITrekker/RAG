questions:
  - id: q01
    question: Who was Ahab?
    category: hard
    answer: Captain of the Pequod, an aging Nantucket whaling captain who lost his leg to Moby Dick and is consumed by the hunt for revenge.
    gold_chapters: [16, 28, 36, 41]

  - id: q02
    question: What was Ahab's beef with Moby?
    category: hard
    answer: Moby Dick bit off Ahab's leg on an earlier voyage, and Ahab swore vengeance on the white whale.
    gold_chapters: [36, 41]

